name: stroy-control

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: stroy-control-postgres
    environment:
      POSTGRES_DB: stroy_control
      POSTGRES_USER: stroy_user
      POSTGRES_PASSWORD: stroy_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    networks:
      - stroy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stroy_user -d stroy_control"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stroy-control-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stroy-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgAdmin for Database Management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: stroy-control-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stroy-control.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - stroy-network
    restart: unless-stopped
    depends_on:
      - postgres
    profiles:
      - dev

  # MinIO for File Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: stroy-control-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - stroy-network
    restart: unless-stopped
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  minio_data:
    driver: local

networks:
  stroy-network:
    driver: bridge