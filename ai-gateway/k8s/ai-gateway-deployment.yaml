apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: stroy-control
  labels:
    app: ai-gateway
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ai-gateway
  template:
    metadata:
      labels:
        app: ai-gateway
        tier: backend
    spec:
      containers:
      - name: ai-gateway
        image: stroy-control/ai-gateway:latest
        ports:
        - containerPort: 8000
        - containerPort: 9090  # Metrics port
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-gateway-secrets
              key: OPENAI_API_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: ai-gateway-secrets
              key: SECRET_KEY
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-gateway-secrets
              key: DATABASE_URL
        envFrom:
        - configMapRef:
            name: ai-gateway-config
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service
  namespace: stroy-control
  labels:
    app: ai-gateway
    tier: backend
spec:
  selector:
    app: ai-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway-service-external
  namespace: stroy-control
  labels:
    app: ai-gateway
    tier: backend
spec:
  selector:
    app: ai-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: LoadBalancer
